; One firmware, four zones. Build/upload one with: pio run -e zone1 -t upload
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0

[env:zone1]
build_flags = -DZONE_ID=1

[env:zone2]
build_flags = -DZONE_ID=2

[env:zone3]
build_flags = -DZONE_ID=3

[env:zone4]
build_flags = -DZONE_ID=4
